name: Publish Helm Repository

on:
  push:
    branches:
      - main
    paths:
      - "helm-charts/hello-k8s/**"
      - ".github/workflows/publish-helm-repo.yml"
      - "README.md"
  pull_request:
    paths:
      - "helm-charts/hello-k8s/**"
      - ".github/workflows/publish-helm-repo.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CHART_DIR: helm-charts/hello-k8s
  SITE_DIR: site
  REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        run: |
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR"
          helm package "$CHART_DIR" --destination "$SITE_DIR"
          helm repo index "$SITE_DIR" --url "$REPO_URL"
          touch "$SITE_DIR/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4