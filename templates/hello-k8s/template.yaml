apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: kubernetes-nginx-deployment
  title: Kubernetes Nginx Deployment
  description: Generate a Kubernetes Deployment manifest for an Nginx workload.
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Service Configuration
      required:
        - applicationName
        - environmentName
      properties:
        applicationName:
          type: string
          title: Application Name
          description: Lowercase Kubernetes-safe app name.
          pattern: '^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])?$'
          examples:
            - webslinger
        environmentName:
          type: string
          title: Environment Name
          description: Target environment namespace and label.
          enum:
            - dev
            - staging
            - prod
          default: dev
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    # Each step executes an action, in this case one templates files into the working directory.
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./skeleton
        values:
          appName: ${{ parameters.applicationName }}
          envName: ${{ parameters.environmentName }}
    # - id: render-manifest
    #   name: Render Kubernetes Deployment
    #   action: fetch:template
    #   input:
    #     url: ./skeleton
    #     targetPath: ./output
    #     values:
    #       appName: ${{ parameters.applicationName }}
    #       envName: ${{ parameters.environmentName }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        description: Kubernetes Deployment manifest for ${{ parameters.applicationName }} in ${{ parameters.environmentName }} environment.
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: 'main'
    
    # The final step is to register our new component in the catalog.
    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    # Let's notify the user that the template has completed using the Notification action
    - id: notify
      name: Notify
      action: notification:send
      input:
        recipients: entity
        entityRefs:
          - user:default/guest
        title: 'Template executed'
        info: 'Your template has been executed'
        severity: 'normal'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}

    # text:
    #   - title: Generated Manifest
    #     content: Deployment manifest generated at output/deployment.yaml.
